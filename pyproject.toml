[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campusnet-auto-login"
version = "0.5.9"
description = "Cross-platform captive-portal keepalive and recovery helper"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CampusNet contributors"}]
dependencies = [
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "PySide6-Essentials>=6.7,<7",
]

[project.scripts]
campusnet = "campusnet.cli:main"
campusnet-desktop = "campusnet.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campusnet = ["assets/*.png", "assets/*.ico", "assets/*.icns"]
